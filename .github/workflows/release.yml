# =============================================================================
# Release Pipeline — GitHub Releases on version tags
# =============================================================================
# Triggers: Push tag matching v*.*.* (e.g., v0.1.0, v1.2.3)
#
# NOTE: PyPI publishing is intentionally disabled for now — this package is
# distributed via GitHub only (see README). The PyPI/TestPyPI jobs below are
# left in place, commented out of the job graph, for when that's ready:
#   1. Register the project on PyPI and configure Trusted Publishing
#      (https://docs.pypi.org/trusted-publishers/) pointing at this repo's
#      `publish` environment.
#   2. Add `publish` and `test-publish` back to `github-release`'s `needs:`
#      (or just re-enable them as their own triggered jobs).
# =============================================================================

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write  # Required for trusted PyPI publishing, once re-enabled

jobs:
  # ===========================================================================
  # Job 1: Validate & Test
  # ===========================================================================
  validate:
    name: ✅ Validate Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"

      - name: Validate version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(python -c "import survey_toolkit; print(survey_toolkit.__version__)")
          echo "Tag version: $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Version mismatch! Tag: $TAG_VERSION, Package: $PKG_VERSION"
            exit 1
          fi
          echo "✅ Versions match"

      - name: Run full test suite
        run: |
          pytest tests/ -v --timeout=300
        env:
          MPLBACKEND: Agg

  # ===========================================================================
  # Job 2: Build distribution
  # ===========================================================================
  build:
    name: 📦 Build distribution
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 90

  # ===========================================================================
  # Job 3: GitHub Release
  # ===========================================================================
  github-release:
    name: 📝 Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for changelog

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Generate changelog
        id: changelog
        run: |
          # Get commits since last tag
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          # Write to file for the release body
          echo "## What's Changed" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "$CHANGELOG" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "## Installation" >> RELEASE_NOTES.md
          echo '```bash' >> RELEASE_NOTES.md
          echo "pip install \"git+https://github.com/TravisBeckwith/surveykit-ml.git@${GITHUB_REF#refs/tags/}\"" >> RELEASE_NOTES.md
          echo '```' >> RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true

  # ===========================================================================
  # PyPI publishing — disabled for now (see note at top of file)
